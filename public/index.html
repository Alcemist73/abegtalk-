<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>AbegTalk</title>
<style>
:root{--bg:#f7f9f7;--panel:#fff;--primary:#16843b;--text:#17231c;--muted:#5d6b62;--line:#e1e8e2;--lime:#d9f27a;--danger:#b3261e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2{line-height:1.15;margin:0 0 .5rem}
button{font:inherit;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid #0b5a26;outline-offset:2px}
.screen{display:none;min-height:100dvh}.screen.on{display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:24px 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(23,35,28,.06);margin:14px 0}
.tag{display:inline-block;background:var(--lime);color:#2c3b0a;border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:600}
.brand{font-size:2.4rem;font-weight:800;color:var(--primary);letter-spacing:-.03em}
.sub{color:var(--muted)}
ol,ul{padding-left:1.2rem;margin:.4rem 0}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
label.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--primary)}
.cta{width:100%;min-height:52px;font-size:1.1rem}
footer{margin-top:auto;text-align:center;color:var(--muted);font-size:.85rem;padding:20px}
.center{margin:auto;text-align:center;max-width:380px;padding:24px}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* chat */
#chat{height:100dvh}
.head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:#aaa}.dot.ok{background:var(--primary)}.dot.warn{background:#d98e04}
.head b{flex:1}.head small{display:block;color:var(--muted);font-weight:400}
.log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.m time{display:block;font-size:.7rem;opacity:.7}
.m.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.m.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.pending{opacity:.6}.m.fail{background:#fbe9e7;color:var(--danger);border:1px solid var(--danger)}
